<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b20">
  <title>Lá thư thanh xuân · Kỷ yếu</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b20}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="letterFrame" title="Lá thư thanh xuân"></iframe>
  <script>
    const name = new URLSearchParams(location.search).get("name") || "";
    document.getElementById("letterFrame").src =
      "../index.html?view=letter&name=" + encodeURIComponent(name);
  </script>
</body>
</html>
