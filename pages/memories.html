<!doctype html>

*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#45205f,#10152f 55%,#050713);color:#fff;font-family:Arial,sans-serif}.subnav{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:#07091bd9;border-bottom:1px solid #ffffff22}.subnav a{color:#f4d5ff;text-decoration:none}.page-wrap{max-width:1100px;margin:0 auto;padding:64px 22px}.eyebrow{letter-spacing:.24em;color:#ff9cdd;font-size:11px}.hero{padding:34px 0 26px;border-bottom:1px solid #ffffff25}.hero h1{font:600 clamp(38px,7vw,68px)/1.05 Georgia;margin:14px 0;text-shadow:0 0 28px #a55cff66}.hero p{color:#d9c9ee;line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.actions button,.editor button{border:1px solid #e3b8ff66;background:#673b87;color:white;padding:12px 18px;border-radius:24px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:25px}.memory-card{position:relative;overflow:hidden;border:1px solid #d9b4ff55;border-radius:18px;background:linear-gradient(145deg,#ffffff18,#0a1029dd);box-shadow:0 14px 40px #0006}.memory-card img,.memory-placeholder{width:100%;height:190px;object-fit:cover;display:grid;place-items:center;background:radial-gradient(circle,#854ab4,#11132c);font-size:52px}.memory-card div:last-of-type{padding:14px}.memory-card h3{margin:0 0 8px}.memory-card p{color:#d5c6e7;line-height:1.5;white-space:pre-wrap}.memory-card button{position:absolute;right:10px;top:10px;border:0;border-radius:50%;width:32px;height:32px;background:#180d28cc;color:white;font-size:20px;cursor:pointer}.editor{position:fixed;inset:0;z-index:50;background:#02040cdd;display:grid;place-items:center;padding:18px}.editor[hidden]{display:none}.editor-box{width:min(620px,100%);max-height:90vh;overflow:auto;padding:24px;border:1px solid #d9a8ff88;border-radius:20px;background:#15102b}.editor h2{margin-top:0}.editor label{display:block;margin:14px 0;color:#e6 </style></head>
